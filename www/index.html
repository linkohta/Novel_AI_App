<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Novel AI 画像生成</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    margin: 0;
    background: #1e1f24;
    color: #e8e8ea;
    display: flex;
    height: 100vh;
  }
  .panel {
    padding: 16px;
    overflow-y: auto;
  }
  .left {
    width: 420px;
    background: #26272e;
    border-right: 1px solid #383944;
  }
  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
  }
  h2 { margin-top: 0; font-size: 16px; }
  label { display: block; margin-top: 10px; font-size: 12px; color: #a9abb5; }
  input, textarea, select {
    width: 100%;
    background: #1a1b20;
    border: 1px solid #3c3d47;
    color: #e8e8ea;
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
    margin-top: 4px;
  }
  textarea { resize: vertical; min-height: 70px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button {
    margin-top: 14px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #6c8cff;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { background: #4a4d5c; cursor: not-allowed; }
  button.secondary {
    background: #3c3d47;
    margin-top: 8px;
  }
  #status { margin-top: 10px; font-size: 12px; color: #a9abb5; white-space: pre-wrap; }
  .generate-sticky {
    position: sticky;
    bottom: -16px;
    margin: 14px -16px -16px -16px;
    padding: 12px 16px 16px;
    background: #26272e;
    border-top: 1px solid #383944;
    z-index: 10;
  }
  .generate-sticky button { margin-top: 0; }
  #result-image {
    max-width: 90%;
    max-height: 70vh;
    border-radius: 8px;
    border: 1px solid #383944;
    display: none;
  }
  #history {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 16px;
    justify-content: center;
  }
  #history img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #383944;
    cursor: pointer;
  }
  .file-info { font-size: 12px; color: #a9abb5; word-break: break-all; }
  .char-card {
    background: #1a1b20;
    border: 1px solid #3c3d47;
    border-radius: 6px;
    padding: 8px;
    margin-top: 8px;
    position: relative;
  }
  .char-card .remove-char {
    position: absolute;
    top: 6px;
    right: 6px;
    width: auto;
    margin: 0;
    padding: 2px 8px;
    font-size: 11px;
    background: #4a3c3c;
  }
  .char-card label { margin-top: 6px; }
  .char-card .char-enable {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    color: #e8e8ea;
  }
  .char-card .char-enable input { width: auto; margin: 0; }
  .char-card.char-disabled {
    opacity: 0.55;
  }
  .char-card textarea:disabled {
    cursor: not-allowed;
  }
  .chunk-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .chunk-row input { flex: 1; }
  .chunk-row button {
    width: auto;
    margin-top: 0;
    padding: 8px 10px;
  }
  #chunkList {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .chunk-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #1a1b20;
    border: 1px solid #3c3d47;
    border-radius: 12px;
    padding: 4px 8px;
    font-size: 12px;
  }
  .chunk-chip .chunk-insert {
    cursor: pointer;
    color: #e8e8ea;
  }
  .chunk-chip .chunk-delete {
    cursor: pointer;
    color: #a9abb5;
    font-weight: bold;
  }
  .chunk-chip .chunk-edit {
    cursor: pointer;
    color: #a9abb5;
  }
  .chunk-chip .chunk-to-template {
    cursor: pointer;
    color: #6c8cff;
    font-size: 11px;
    white-space: nowrap;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open {
    display: flex;
  }
  .modal {
    background: #26272e;
    border: 1px solid #383944;
    border-radius: 8px;
    padding: 20px;
    width: 420px;
  }
  .modal h2 { margin-top: 0; }
  .modal textarea { min-height: 100px; }
  .modal-buttons {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .modal-buttons button {
    width: auto;
    padding: 8px 16px;
  }
  .template-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #1a1b20;
    border: 1px solid #3c3d47;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    margin-top: 6px;
  }
  .template-chip .template-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .template-chip button {
    width: auto;
    margin: 0;
    padding: 4px 8px;
    font-size: 11px;
  }
  .template-chip .template-apply { background: #6c8cff; }
  .template-chip .template-edit,
  .template-chip .template-delete { background: #3c3d47; }
  .modal .template-var-field { margin-bottom: 4px; }
  .modal .no-vars { color: #a9abb5; font-size: 12px; margin-top: 8px; }
  details.section {
    margin-top: 14px;
  }
  details.section:first-of-type {
    margin-top: 0;
  }
  details.section > summary {
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    padding: 4px 0;
    list-style: none;
    user-select: none;
  }
  details.section > summary::-webkit-details-marker {
    display: none;
  }
  details.section > summary::before {
    content: '▶';
    display: inline-block;
    margin-right: 6px;
    font-size: 11px;
    transition: transform 0.15s;
  }
  details.section[open] > summary::before {
    transform: rotate(90deg);
  }
  details.section > summary + * {
    margin-top: 10px;
  }
</style>
</head>
<body>
  <div class="panel left">
    <details class="section" open id="settingsSection">
      <summary>設定</summary>
      <label>NovelAI API キー (persistent token)</label>
      <input type="password" id="apiKey" placeholder="pst-..." />
    </details>

    <details class="section" open id="promptSection">
      <summary>プロンプト</summary>
      <label>プロンプト</label>
      <textarea id="prompt" placeholder="1girl, silver hair, ..."></textarea>

      <label>ネガティブプロンプト</label>
      <textarea id="negativePrompt" placeholder="lowres, bad anatomy, ..."></textarea>

      <div class="chunk-row">
        <input type="text" id="chunkName" placeholder="チャンク名" />
        <button type="button" id="saveChunkBtn">プロンプトを保存</button>
      </div>
      <div id="chunkList"></div>
    </details>

    <details class="section" id="templateSection">
      <summary>プロンプトテンプレート</summary>
      <label>テンプレート名</label>
      <input type="text" id="templateName" placeholder="テンプレート名" />
      <label>テンプレート本文（変数は (変数名) の形式で任意個数指定可能）</label>
      <textarea id="templateText" placeholder="1girl, (hair_color) hair, (pose), masterpiece"></textarea>
      <button type="button" id="saveTemplateBtn">テンプレートを保存</button>
      <div id="templateList"></div>
    </details>

    <details class="section" id="favoritesSection">
      <summary>お気に入り</summary>
      <label>お気に入りアーティスト</label>
      <div class="chunk-row">
        <input type="text" id="favArtistName" placeholder="アーティスト名" />
        <button type="button" id="saveFavArtistBtn">保存</button>
      </div>
      <div id="favArtistList"></div>

      <label>お気に入りキャラクター</label>
      <div class="row">
        <div>
          <label>キャラクター名</label>
          <input type="text" id="favCharName" placeholder="hatsune miku" />
        </div>
        <div>
          <label>作品名（任意）</label>
          <input type="text" id="favCharSeries" placeholder="vocaloid" />
        </div>
      </div>
      <button type="button" id="saveFavCharBtn">キャラクターを保存</button>
      <div id="favCharList"></div>
    </details>

    <details class="section" open id="characterSection">
      <summary>キャラクタープロンプト</summary>
      <div class="row">
        <div>
          <label>キャラクター名</label>
          <input type="text" id="charNameByName" placeholder="hatsune miku" />
        </div>
        <div>
          <label>作品名（任意）</label>
          <input type="text" id="charSeriesByName" placeholder="vocaloid" />
        </div>
      </div>
      <label>組み合わせるチャンク／テンプレート（任意）</label>
      <select id="charNameSource">
        <option value="">なし</option>
      </select>
      <button type="button" class="secondary" id="addCharByNameBtn">キャラクター名で追加</button>
      <div id="characterList"></div>
      <button type="button" class="secondary" id="addCharBtn">＋ キャラクターを追加</button>
    </details>

    <details class="section" open id="modelSection">
      <summary>モデル</summary>
      <label>モデル</label>
      <select id="model">
        <option value="nai-diffusion-3">nai-diffusion-3</option>
        <option value="nai-diffusion-4-full">nai-diffusion-4-full</option>
        <option value="nai-diffusion-4-curated-preview">nai-diffusion-4-curated-preview</option>
        <option value="nai-diffusion-4-5-full">nai-diffusion-4-5-full</option>
        <option value="nai-diffusion-4-5-curated">nai-diffusion-4-5-curated</option>
        <option value="nai-diffusion-5-full" selected>nai-diffusion-5-full</option>
        <option value="nai-diffusion-5-curated">nai-diffusion-5-curated</option>
      </select>

      <div class="row">
        <div>
          <label>幅</label>
          <input type="number" id="width" value="1216" step="64" />
        </div>
        <div>
          <label>高さ</label>
          <input type="number" id="height" value="832" step="64" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>ステップ数</label>
          <input type="number" id="steps" value="28" />
        </div>
        <div>
          <label>スケール</label>
          <input type="number" id="scale" value="5" step="0.5" />
        </div>
      </div>

      <label>サンプラー</label>
      <select id="sampler">
        <option value="k_euler_ancestral">k_euler_ancestral</option>
        <option value="k_euler">k_euler</option>
        <option value="k_dpmpp_2s_ancestral">k_dpmpp_2s_ancestral</option>
        <option value="k_dpmpp_2m">k_dpmpp_2m</option>
      </select>

      <label>シード (0でランダム)</label>
      <input type="number" id="seed" value="0" />
    </details>

    <div class="generate-sticky">
      <button id="generateBtn">生成する</button>
    </div>

    <details class="section" id="batchSection">
      <summary>連続生成</summary>
      <div class="row">
        <div>
          <label>生成回数</label>
          <input type="number" id="batchCount" value="1" min="1" max="100" />
        </div>
        <div>
          <label>生成間隔（秒）</label>
          <input type="number" id="batchInterval" value="5" min="1" max="120" />
        </div>
      </div>
      <div class="row">
        <div><button type="button" id="batchGenerateBtn">連続生成する</button></div>
        <div><button type="button" class="secondary" id="batchStopBtn" disabled>中断する</button></div>
      </div>
      <div id="batchStatus" class="file-info"></div>
    </details>

    <button class="secondary" id="openFolderBtn">保存フォルダを開く</button>
    <div id="status"></div>
  </div>

  <div class="panel right">
    <img id="result-image" />
    <div class="file-info" id="file-info"></div>
    <div id="history"></div>
  </div>

  <div id="chunkEditOverlay" class="modal-overlay">
    <div class="modal">
      <h2>プロンプトチャンクを編集</h2>
      <label>チャンク名</label>
      <input type="text" id="chunkEditName" />
      <label>プロンプト</label>
      <textarea id="chunkEditText"></textarea>
      <div class="modal-buttons">
        <button type="button" class="secondary" id="chunkEditCancel">キャンセル</button>
        <button type="button" id="chunkEditSave">保存</button>
      </div>
    </div>
  </div>

  <div id="templateEditOverlay" class="modal-overlay">
    <div class="modal">
      <h2>プロンプトテンプレートを編集</h2>
      <label>テンプレート名</label>
      <input type="text" id="templateEditName" />
      <label>テンプレート本文（変数は (変数名) の形式）</label>
      <textarea id="templateEditText"></textarea>
      <div class="modal-buttons">
        <button type="button" class="secondary" id="templateEditCancel">キャンセル</button>
        <button type="button" id="templateEditSave">保存</button>
      </div>
    </div>
  </div>

  <div id="templateApplyOverlay" class="modal-overlay">
    <div class="modal">
      <h2>テンプレートの変数を入力</h2>
      <div id="templateApplyFields"></div>
      <div class="modal-buttons">
        <button type="button" class="secondary" id="templateApplyCancel">キャンセル</button>
        <button type="button" id="templateApplyConfirm">反映</button>
      </div>
    </div>
  </div>

  <div id="favArtistEditOverlay" class="modal-overlay">
    <div class="modal">
      <h2>お気に入りアーティストを編集</h2>
      <label>アーティスト名</label>
      <input type="text" id="favArtistEditName" />
      <div class="modal-buttons">
        <button type="button" class="secondary" id="favArtistEditCancel">キャンセル</button>
        <button type="button" id="favArtistEditSave">保存</button>
      </div>
    </div>
  </div>

  <div id="favCharEditOverlay" class="modal-overlay">
    <div class="modal">
      <h2>お気に入りキャラクターを編集</h2>
      <label>キャラクター名</label>
      <input type="text" id="favCharEditName" />
      <label>作品名（任意）</label>
      <input type="text" id="favCharEditSeries" />
      <div class="modal-buttons">
        <button type="button" class="secondary" id="favCharEditCancel">キャンセル</button>
        <button type="button" id="favCharEditSave">保存</button>
      </div>
    </div>
  </div>

  <script src="capacitor-bridge.bundle.js"></script>
  <script src="js/state.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/chunks.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/batch.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
